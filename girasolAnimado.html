<!doctype html>

<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Flores Amarillas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #07050a;
      --bg-2: #150c05;
      --gold: #ffc61a;
      --amber: #ff8a00;
      --ember: #ff4d00;
      --cream: #fff6e0;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          60% 45% at 50% 38%,
          rgba(255, 150, 0, 0.16),
          transparent 70%
        ),
        radial-gradient(
          90% 70% at 50% 50%,
          var(--bg-2),
          var(--bg) 60%
        );

      background-color: var(--bg);
      color: var(--cream);

      font-family:
        "Cormorant Garamond",
        Georgia,
        "Times New Roman",
        serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: clamp(18px, 5vh, 48px);

      overflow: hidden;
      padding: 24px 16px;
    }

    /* =========================
       PARTÍCULAS
       ========================= */

    .sparks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .spark {
      position: absolute;
      bottom: -10px;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: var(--gold);

      box-shadow:
        0 0 6px 1px rgba(255, 190, 60, 0.8);

      opacity: 0;

      animation: rise linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translate3d(0, 0, 0) scale(0.6);
        opacity: 0;
      }

      12% {
        opacity: 0.9;
      }

      80% {
        opacity: 0.5;
      }

      100% {
        transform:
          translate3d(var(--dx, 20px), -104vh, 0)
          scale(1.1);

        opacity: 0;
      }
    }

    /* =========================
       FLOR
       ========================= */

    .stage {
      position: relative;
      z-index: 1;

      width: min(78vw, 46vh, 420px);
      aspect-ratio: 1;

      display: grid;
      place-items: center;

      filter:
        drop-shadow(
          0 0 60px rgba(255, 140, 0, 0.28)
        );

      animation: sway 9s ease-in-out infinite;
    }

    @keyframes sway {
      0%,
      100% {
        transform: rotate(-2.2deg);
      }

      50% {
        transform: rotate(2.2deg);
      }
    }

    .flower {
      position: absolute;
      inset: 0;

      display: grid;
      place-items: center;

      animation: breathe 4.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.045);
      }
    }

    .halo {
      position: absolute;

      width: 118%;
      aspect-ratio: 1;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 170, 30, 0.30),
          rgba(255, 110, 0, 0.10) 45%,
          transparent 68%
        );

      animation: glow 4.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%,
      100% {
        opacity: 0.75;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.07);
      }
    }

    .layer {
      position: absolute;
      inset: 0;
      display: block;
    }

    .layer.spin-a {
      animation: spin 70s linear infinite;
    }

    .layer.spin-b {
      animation: spin 95s linear reverse infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .petal {
      position: absolute;

      left: 50%;
      top: 50%;

      transform-origin: 50% 0%;

      border-radius:
        50% 50% 46% 46% /
        58% 58% 42% 42%;

      filter:
        drop-shadow(
          0 0 6px rgba(224, 82, 0, 0.55)
        );
    }

    .petal::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 12%;

      width: 1.5px;
      height: 76%;

      margin-left: -0.75px;

      border-radius: 2px;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.35),
          rgba(255, 255, 255, 0)
        );
    }

    /* =========================
       CENTRO DE LA FLOR
       ========================= */

    .center {
      position: relative;
      z-index: 9;

      width: 27%;
      aspect-ratio: 1;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 38% 34%,
          rgba(255, 255, 255, 0.22),
          transparent 42%
        ),
        radial-gradient(
          circle,
          #2a0d00 0%,
          #7a2b00 34%,
          #ff6a00 72%,
          #ffae00 100%
        );

      box-shadow:
        inset 0 0 22px rgba(0, 0, 0, 0.85),
        0 0 26px rgba(255, 90, 0, 0.65);

      overflow: hidden;
    }

    .seeds {
      position: absolute;
      inset: 0;
    }

    .seed {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 2.2px;
      height: 2.2px;

      border-radius: 50%;

      background: rgba(255, 205, 120, 0.55);

      transform: translate(-50%, -50%);
    }

    /* =========================
       TEXTO
       ========================= */

    .words {
      position: relative;
      z-index: 2;

      text-align: center;

      display: flex;
      flex-direction: column;

      gap: 0.55em;

      padding: 0 8px;
    }

    .line1 {
      margin: 0;

      font-size: clamp(22px, 5.2vw, 40px);

      font-weight: 600;

      letter-spacing: 0.02em;

      color: var(--cream);

      text-shadow:
        0 0 22px rgba(255, 170, 40, 0.45);

      opacity: 0;

      animation:
        fade 1.4s ease-out 0.5s forwards;
    }

    .name {
      background:
        linear-gradient(
          100deg,
          #ffe9a8,
          #ffc61a 35%,
          #ff9500 55%,
          #ffe9a8 80%
        );

      background-size: 220% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        shimmer 6s linear infinite;
    }

    @keyframes shimmer {
      to {
        background-position: 220% center;
      }
    }

    .line2 {
      margin: 0;

      font-style: italic;

      font-size: clamp(17px, 3.9vw, 27px);

      color: rgba(255, 246, 224, 0.82);

      opacity: 0;

      animation:
        fade 1.4s ease-out 1.15s forwards;
    }

    .heart {
      display: inline-block;

      color: var(--gold);

      animation:
        beat 1.8s ease-in-out infinite;
    }

    @keyframes beat {
      0%,
      100% {
        transform: scale(1);
      }

      30% {
        transform: scale(1.22);
      }

      60% {
        transform: scale(1);
      }
    }

    @keyframes fade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .line1,
    .line2 {
      transform: translateY(10px);
    }

    /* =========================
       REDUCIR ANIMACIONES
       ========================= */

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }

      .line1,
      .line2 {
        opacity: 1;
        transform: none;
      }
    }

    /* =========================
       CELULARES PEQUEÑOS
       ========================= */

    @media (max-height: 650px) {
      body {
        gap: 12px;
        padding: 12px;
      }

      .stage {
        width: min(65vw, 48vh, 340px);
      }

      .line1 {
        font-size: clamp(19px, 5vw, 30px);
      }

      .line2 {
        font-size: clamp(15px, 3.8vw, 23px);
      }
    }
  </style>

</head>

<body>

  <!-- PARTÍCULAS -->

  <div class="sparks" id="sparks"></div>

  <!-- FLOR -->

  <div class="stage">

```
<div class="flower">

  <div class="halo"></div>

  <div class="layer spin-b" id="L3"></div>

  <div class="layer spin-a" id="L2"></div>

  <div class="layer" id="L1"></div>

  <div class="center">
    <div class="seeds" id="seeds"></div>
  </div>

</div>
```

  </div>

  <!-- TEXTO -->

  <div class="words">

```
<h1 class="line1">
  🌻 Feliz 21 de Septiembre,
  <span class="name">Deyanira</span>
  🌻
</h1>

<p class="line2">
  Te quiero mucho, amiguita
  <span class="heart">💛</span>
</p>
```

  </div>

  <script>
    (function () {

      /* =========================
         CAPAS DE PÉTALOS
         ========================= */

      var layers = [
        [
          "L3",
          16,
          13,
          48,
          4,
          "linear-gradient(to bottom, #ffdd4d, #ffab00 55%, #ff6a00)"
        ],

        [
          "L2",
          12,
          15,
          40,
          6,
          "linear-gradient(to bottom, #ffe680, #ffc21a 55%, #ff7a00)"
        ],

        [
          "L1",
          8,
          13,
          30,
          8,
          "linear-gradient(to bottom, #fff0a8, #ffd03a 55%, #ff8c00)"
        ]
      ];

      layers.forEach(function (cfg) {

        var host = document.getElementById(cfg[0]);

        var n = cfg[1];

        for (var i = 0; i < n; i++) {

          var p = document.createElement("div");

          p.className = "petal";

          p.style.width = cfg[2] + "%";

          p.style.height = cfg[3] + "%";

          p.style.marginLeft =
            (-cfg[2] / 2) + "%";

          p.style.background = cfg[5];

          var jitter =
            (Math.random() - 0.5) * 2.2;

          p.style.transform =
            "rotate(" +
            ((360 / n) * i + jitter) +
            "deg) translateY(" +
            cfg[4] +
            "%)";

          host.appendChild(p);
        }
      });


      /* =========================
         SEMILLAS DEL CENTRO
         ========================= */

      var seeds =
        document.getElementById("seeds");

      var golden =
        Math.PI * (3 - Math.sqrt(5));

      for (var s = 0; s < 130; s++) {

        var r =
          Math.sqrt(s / 130) * 46;

        var a =
          s * golden;

        var d =
          document.createElement("div");

        d.className = "seed";

        d.style.left =
          (50 + r * Math.cos(a)) + "%";

        d.style.top =
          (50 + r * Math.sin(a)) + "%";

        d.style.opacity =
          0.25 + Math.random() * 0.5;

        seeds.appendChild(d);
      }


      /* =========================
         PARTÍCULAS
         ========================= */

      var sparks =
        document.getElementById("sparks");

      for (var k = 0; k < 34; k++) {

        var e =
          document.createElement("div");

        e.className = "spark";

        e.style.left =
          Math.random() * 100 + "%";

        e.style.setProperty(
          "--dx",
          ((Math.random() - 0.5) * 120).toFixed(0) + "px"
        );

        e.style.animationDuration =
          (9 + Math.random() * 11).toFixed(1) + "s";

        e.style.animationDelay =
          (-Math.random() * 18).toFixed(1) + "s";

        var sz =
          (1.5 + Math.random() * 2.5).toFixed(1);

        e.style.width = sz + "px";

        e.style.height = sz + "px";

        sparks.appendChild(e);
      }

    })();
  </script>

</body>
</html>
